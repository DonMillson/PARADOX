name: Build PARADOX

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python for branded installer icon
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "6.0.x"

      - name: Restore pinned v19 dependencies
        run: dotnet restore src/Paradox/Paradox.csproj --configfile nuget.config

      - name: Verify v19 dependency pins
        shell: pwsh
        run: ./scripts/check-v19-toolchain.ps1

      - name: Verify role roster and RPC identifiers
        shell: pwsh
        run: ./scripts/check-role-manifest.ps1

      - name: Validate Paradox Station geometry
        shell: pwsh
        run: ./scripts/check-station-layout.ps1

      - name: Test role state logic
        run: dotnet run --project tests/Paradox.RoleStateTests/Paradox.RoleStateTests.csproj -c Release

      - name: Build
        run: dotnet build src/Paradox/Paradox.csproj -c Release

      - name: Stage v19 test installation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = "dist/PARADOX-v0.7.0-dev.7-v19-test/BepInEx/plugins"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "src/Paradox/bin/Release/net6.0/Paradox.dll" $stage
          $reactorDir = Join-Path $env:USERPROFILE ".nuget/packages/reactor/2.5.1-ci.400"
          $reactor = Get-ChildItem -Path $reactorDir -Filter Reactor.dll -File -Recurse |
            Where-Object { $_.FullName -match '[\\/]lib[\\/]' } |
            Select-Object -First 1
          if (-not $reactor) { throw "Compatible Reactor 2.5.1-ci.400 runtime DLL missing in NuGet package" }
          Copy-Item $reactor.FullName (Join-Path $stage "Reactor.dll")
          Copy-Item "docs/V19_INSTALL_PL.md" "dist/PARADOX-v0.7.0-dev.7-v19-test/README-PL.md"
          Copy-Item "scripts/install-v19.ps1" "dist/PARADOX-v0.7.0-dev.7-v19-test/install-v19.ps1"
          Write-Host "v19 test package staged with Paradox.dll and NuGet Reactor.dll"

      - name: Upload v19 test package
        uses: actions/upload-artifact@v4
        with:
          name: PARADOX-v0.7.0-dev.7-v19-test-NOT-RUNTIME-VERIFIED
          path: dist/PARADOX-v0.7.0-dev.7-v19-test/
          if-no-files-found: error

      - name: Stage offline BepInEx 6 IL2CPP x64
        shell: pwsh
        run: ./installer/Stage-Payload.ps1

      - name: Smoke test full installer and uninstaller
        shell: pwsh
        run: ./installer/Test-Installer.ps1

      - name: Generate PARADOX-themed Windows installer artwork
        shell: pwsh
        run: ./installer/Generate-Branding.ps1

      - name: Generate PARADOX Windows EXE icon
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "Pillow==11.3.0"
          if ($LASTEXITCODE -ne 0) { throw "Pillow installation failed" }
          python scripts/generate_paradox_icon.py --output dist/branding/paradox.ico
          if ($LASTEXITCODE -ne 0) { throw "PARADOX icon generation failed" }

      - name: Compile Windows setup EXE
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $base86=[Environment]::GetFolderPath('ProgramFilesX86')
          $base64=[Environment]::GetFolderPath('ProgramFiles')
          $paths=@(
            (Join-Path $base86 'Inno Setup 6/ISCC.exe'),
            (Join-Path $base64 'Inno Setup 6/ISCC.exe')
          )
          $compiler=$paths | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (-not $compiler) {
            choco install innosetup --yes --no-progress --limit-output
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }
            $compiler=$paths | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          }
          if (-not $compiler) { throw "Inno Setup compiler ISCC.exe not found" }
          & $compiler "installer/PARADOX.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC.exe could not compile the PARADOX setup" }
          $setup=Get-ChildItem "dist/installer/out" -Filter 'PARADOX-Setup-*.exe' -File |
            Select-Object -First 1
          if (-not $setup -or $setup.Length -lt 200000) {
            throw "Expected self-contained Windows EXE installer missing"
          }
          Write-Host "PARADOX Windows Setup: $($setup.FullName)"
          Write-Host "SHA256: $((Get-FileHash $setup.FullName -Algorithm SHA256).Hash)"

      - name: Upload complete Windows setup EXE
        uses: actions/upload-artifact@v4
        with:
          name: PARADOX-FULL-INSTALLER-v0.7.0-dev.7-AmongUs19-x64
          path: dist/installer/out/PARADOX-Setup-*.exe
          if-no-files-found: error
