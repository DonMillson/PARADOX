name: Build PARADOX

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "6.0.x"

      - name: Download Reactor 2.5.1 (2026 release)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path lib | Out-Null
          Invoke-WebRequest -Uri "https://github.com/NuclearPowered/Reactor/releases/download/2.5.1/Reactor.dll" -OutFile "lib/Reactor.dll"

      - name: Verify role roster and RPC identifiers
        shell: pwsh
        run: ./scripts/check-role-manifest.ps1

      - name: Validate Paradox Station geometry
        shell: pwsh
        run: ./scripts/check-station-layout.ps1

      - name: Build
        run: dotnet build src/Paradox/Paradox.csproj -c Release

      - name: Upload Paradox DLL
        uses: actions/upload-artifact@v4
        with:
          name: PARADOX-v0.6.0-alpha.4
          path: src/Paradox/bin/Release/net6.0/Paradox.dll
