name: Build PARADOX AMONG US Online Launcher EXE

on:
  push:
    branches: ["main"]
    paths:
      - "launcher_python/**"
      - "scripts/generate_paradox_icon.py"
      - "installer/**"
      - "src/Paradox/**"
      - "nuget.config"
      - ".github/workflows/python-launcher.yml"
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  offline-launcher:
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout PARADOX
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "6.0.x"

      - name: Restore and compile PARADOX
        shell: pwsh
        run: |
          dotnet restore src/Paradox/Paradox.csproj --configfile nuget.config
          if ($LASTEXITCODE -ne 0) { throw "NuGet restore failed" }
          dotnet build src/Paradox/Paradox.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw "PARADOX compilation failed" }

      - name: Stage full loader for installation smoke test (not embedded)
        shell: pwsh
        run: ./installer/Stage-Payload.ps1

      - name: Validate existing setup and rollback
        shell: pwsh
        run: ./installer/Test-Installer.ps1

      - name: Install Python GUI and packaging dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "customtkinter==5.2.2" "pyinstaller==6.16.0" "Pillow==11.3.0"
          if ($LASTEXITCODE -ne 0) { throw "Python dependencies failed" }

      - name: Test loader download resolver and GUI logic without opening UI
        shell: pwsh
        run: |
          python -m unittest discover -v -s launcher_python -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { throw "Launcher unit tests failed" }
          python -m py_compile launcher_python/paradox_launcher.py launcher_python/paradox_visuals.py
          if ($LASTEXITCODE -ne 0) { throw "Launcher syntax check failed" }

      - name: Live end-to-end official dependency download verification
        shell: pwsh
        run: |
          $env:PYTHONIOENCODING = "utf-8"
          @'
          from pathlib import Path
          import tempfile
          from launcher_python.online_dependencies import stage_live_dependencies
          import base64, hashlib, os
          nuget_cache = Path.home() / ".nuget/packages/reactor/2.5.1-ci.400/reactor.2.5.1-ci.400.nupkg"
          if nuget_cache.is_file():
              print("REACTOR_PIN_SHA512=" + base64.b64encode(
                  hashlib.sha512(nuget_cache.read_bytes()).digest()
              ).decode("ascii"))
          with tempfile.TemporaryDirectory(prefix="paradox-live-") as work:
              result = stage_live_dependencies(
                  Path(work) / "payload",
                  Path("src/Paradox/bin/Release/net6.0/Paradox.dll"),
                  lambda amount, status: print(f"{amount:.0%} {status}"),
              )
              print("PASS: official BepInEx and Reactor downloaded, hashes checked:", result)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "Official download integration test failed" }

      - name: Generate custom PARADOX Windows icon
        shell: pwsh
        run: |
          python scripts/generate_paradox_icon.py --output dist/branding/paradox.ico
          if ($LASTEXITCODE -ne 0) { throw "PARADOX icon generation failed" }

      - name: Build single online updater launcher EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --uac-admin --icon "dist/branding/paradox.ico" --name "PARADOX-AMONG-US-Ship-Launcher-v0.7.0-dev.7-x64" --collect-all customtkinter --collect-all PIL --add-data "launcher_python/assets/paradox_installer_reference.webp;launcher_python/assets" --add-data "src/Paradox/bin/Release/net6.0/Paradox.dll;mod" --add-data "launcher_python/compatibility.json;launcher_python" --add-data "installer/Install-Paradox.ps1;installer" --add-data "installer/Uninstall-Paradox.ps1;installer" launcher_python/paradox_launcher.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller build failed" }
          $exe=Get-Item "dist/PARADOX-AMONG-US-Ship-Launcher-v0.7.0-dev.7-x64.exe"
          if ($exe.Length -lt 1000000) { throw "Missing or invalid bundled EXE" }
          Write-Host "Launcher executable: $($exe.FullName)"
          Write-Host "File size: $($exe.Length) bytes"
          Write-Host "SHA256: $((Get-FileHash $exe.FullName -Algorithm SHA256).Hash)"

      - name: Check bundled resources inside EXE archive
        shell: pwsh
        run: |
          $archive=python -m PyInstaller.utils.cliutils.archive_viewer "dist/PARADOX-AMONG-US-Ship-Launcher-v0.7.0-dev.7-x64.exe" -b 2>&1
          $txt=$archive | Out-String
          foreach ($name in @('Install-Paradox.ps1', 'Paradox.dll', 'compatibility.json', 'paradox_installer_reference.webp')) {
            if (-not $txt.Contains($name)) { throw "Missing archived component: $name" }
          }
          if ($txt.Contains('BepInEx/core') -or $txt.Contains('Reactor.dll')) { throw "Online EXE must not bundle outdated loader files" }
          Write-Host "PASS: online EXE contains PARADOX and downloader metadata, not old loader"

      - name: Upload online PARADOX launcher
        uses: actions/upload-artifact@v4
        with:
          name: PARADOX-AMONG-US-SHIP-LAUNCHER-v0.7.0-dev.7-x64
          path: dist/PARADOX-AMONG-US-Ship-Launcher-v0.7.0-dev.7-x64.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish public GitHub Release for easy sharing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'v0.7.0-dev.7-ship-ui'
          $exe = 'dist/PARADOX-AMONG-US-Ship-Launcher-v0.7.0-dev.7-x64.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'Missing verified EXE' }
          $notes = @'
          PARADOX AMONG US — instalator online dla Windows x64.
          
          Nowy motyw PARADOX: statek Among Us, załogant, hazard tape i ekrany security/electrical/cargo bay. Mini-gra, zadanie matematyczne, pobieranie i diagnostyka modów oraz raport błędów do skopiowania.
          Wbudowana Paradox.dll w wersji 0.7.0-dev.7. Wymaga internetu do pobrania sprawdzonych zależności.
          Podczas instalacji pobiera oficjalny BepInEx Unity IL2CPP x64 i kompatybilny Reactor 2.5.1-ci.400. Wymaga internetu.
          
          UWAGA: wersja eksperymentalna dla Among Us 19.0.0. Kompilacja, pobieranie pakietów i testy instalatora przeszły, ale rozgrywka multiplayer nie została jeszcze zweryfikowana.
          '@
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $exe --clobber --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw 'Unable to upload updated installer' }
          } else {
            gh release create $tag $exe --target $env:GITHUB_SHA --title 'PARADOX AMONG US Ship Launcher v0.7.0-dev.7' --notes $notes --prerelease --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw 'Unable to create public GitHub Release' }
          }
          Write-Host "PUBLIC DOWNLOAD: https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/PARADOX-AMONG-US-Ship-Launcher-v0.7.0-dev.7-x64.exe"
