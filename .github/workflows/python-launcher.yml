name: Build PARADOX AMONG US Online Launcher EXE

on:
  push:
    branches: ["main"]
    paths:
      - "launcher_python/**"
      - "installer/**"
      - "src/Paradox/**"
      - "nuget.config"
      - ".github/workflows/python-launcher.yml"
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  online-launcher:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout PARADOX
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "6.0.x"

      - name: Restore and compile PARADOX
        shell: pwsh
        run: |
          dotnet restore src/Paradox/Paradox.csproj --configfile nuget.config
          if ($LASTEXITCODE -ne 0) { throw "NuGet restore failed" }
          dotnet build src/Paradox/Paradox.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw "PARADOX compilation failed" }

      - name: Install GUI and packaging tools
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "customtkinter==5.2.2" "pyinstaller==6.16.0"
          if ($LASTEXITCODE -ne 0) { throw "Python dependencies failed" }

      - name: Test UI logic and secure dependency selection
        shell: pwsh
        run: |
          python -m unittest -v launcher_python/test_launcher.py launcher_python/test_online_dependencies.py
          if ($LASTEXITCODE -ne 0) { throw "Launcher unit tests failed" }
          python -m py_compile launcher_python/paradox_launcher.py launcher_python/online_dependencies.py
          if ($LASTEXITCODE -ne 0) { throw "Launcher syntax check failed" }

      - name: Download and test real official vendors (not embedded)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "mod" | Out-Null
          Copy-Item "src/Paradox/bin/Release/net6.0/Paradox.dll" "mod/Paradox.dll"
          New-Item -ItemType Directory -Force -Path "dist/installer/payload" | Out-Null
          python -c "from pathlib import Path; from launcher_python.online_dependencies import assemble_payload; assemble_payload(Path('dist/installer/payload'), lambda name, frac: print(round(frac * 100), name))"
          if ($LASTEXITCODE -ne 0) { throw "Official vendor download or checksum validation failed" }
          ./installer/Test-Installer.ps1
          if ($LASTEXITCODE -ne 0) { throw "Installer integration test failed" }

      - name: Build lightweight online launcher
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --uac-admin --paths "." --name "PARADOX-AMONG-US-Online-Launcher-v0.7.0-dev.4-x64" --collect-all customtkinter --add-data "mod/Paradox.dll;mod" --add-data "launcher_python/dependencies.json;launcher_python" --add-data "installer/Install-Paradox.ps1;installer" --add-data "installer/Uninstall-Paradox.ps1;installer" launcher_python/paradox_launcher.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller build failed" }
          $exe=Get-Item "dist/PARADOX-AMONG-US-Online-Launcher-v0.7.0-dev.4-x64.exe"
          if ($exe.Length -lt 1000000) { throw "Bundled EXE missing or implausibly small" }
          Write-Host "PARADOX online launcher: $($exe.FullName)"
          Write-Host "SHA256: $((Get-FileHash $exe.FullName -Algorithm SHA256).Hash)"

      - name: Verify lightweight EXE payload
        shell: pwsh
        run: |
          $archive=python -m PyInstaller.utils.cliutils.archive_viewer "dist/PARADOX-AMONG-US-Online-Launcher-v0.7.0-dev.4-x64.exe" -b 2>&1
          $txt=$archive | Out-String
          foreach ($name in @('Install-Paradox.ps1', 'Paradox.dll', 'dependencies.json', 'online_dependencies')) {
            if (-not $txt.Contains($name)) { throw "Missing required bundled resource: $name" }
          }
          if ($txt.Contains('BepInEx/core')) { throw 'Vendor binaries should not be bundled in lightweight launcher' }
          Write-Host 'PASS: EXE includes PARADOX but retrieves official dependencies at install time'

      - name: Upload online PARADOX launcher
        uses: actions/upload-artifact@v4
        with:
          name: PARADOX-ONLINE-LAUNCHER-v0.7.0-dev.4-x64
          path: dist/PARADOX-AMONG-US-Online-Launcher-v0.7.0-dev.4-x64.exe
          if-no-files-found: error
          retention-days: 30
