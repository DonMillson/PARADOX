name: Export PARADOX Production Room Art

on:
  push:
    branches: [ "main" ]
    paths:
      - "art/arrival-bay/**"
      - "art/station-rooms/**"
      - "tools/generate_station_room_art.py"
      - "tools/export_station_art.py"
      - "tools/requirements-art.txt"
      - "unity/ParadoxStation/**"
      - ".github/workflows/station-art.yml"
  workflow_dispatch:

jobs:
  export-production-art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install SVG renderer
        run: pip install -r tools/requirements-art.txt
      - name: Verify and export 12 room source art layers
        run: python tools/export_station_art.py --output output/StationRooms
      - uses: actions/upload-artifact@v4
        with:
          name: PARADOX-12-Rooms-Unity-Art
          path: output/StationRooms/
