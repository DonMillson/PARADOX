name: PARADOX Steam Companion Hub

on:
  push:
    branches: [main]
    paths:
      - "steam_hub/**"
      - "launcher_python/**"
      - "installer/**"
      - "src/Paradox/**"
      - ".github/workflows/steam-hub.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-hub:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "6.0.x"

      - name: Build mod with pinned Reactor and GameLibs
        shell: pwsh
        run: |
          dotnet restore src/Paradox/Paradox.csproj --configfile nuget.config
          if ($LASTEXITCODE -ne 0) { throw "NuGet restore failed" }
          dotnet build src/Paradox/Paradox.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw "Paradox.dll compilation failed" }

      - name: Python dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "customtkinter==5.2.2" "pyinstaller==6.16.0"
          if ($LASTEXITCODE -ne 0) { throw "CustomTkinter / PyInstaller failed" }

      - name: Unit tests and syntax checks
        shell: pwsh
        run: |
          $env:PYTHONIOENCODING='utf-8'
          python -m unittest discover -v -s steam_hub -p "test_*.py"
          if ($LASTEXITCODE -ne 0) { throw "Steam hub tests failed" }
          python -m unittest discover -v -s launcher_python -p "test_*.py"
          if ($LASTEXITCODE -ne 0) { throw "Launcher and installer tests failed" }
          python -m py_compile steam_hub/paradox_hub.py steam_hub/steam_bridge.py
          if ($LASTEXITCODE -ne 0) { throw "Hub syntax failed" }

      - name: Build PARADOX Hub as one Windows EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --uac-admin --name "PARADOX-Hub-v0.7.0-dev.7-x64" --collect-all customtkinter --add-data "src/Paradox/bin/Release/net6.0/Paradox.dll;mod" --add-data "launcher_python/compatibility.json;launcher_python" --add-data "installer/Install-Paradox.ps1;installer" --add-data "installer/Uninstall-Paradox.ps1;installer" steam_hub/paradox_hub.py
          if ($LASTEXITCODE -ne 0) { throw "Hub build failed" }
          $exe=Get-Item "dist/PARADOX-Hub-v0.7.0-dev.7-x64.exe"
          if ($exe.Length -lt 1000000) { throw "Executable is unexpectedly small" }
          Write-Host "PARADOX HUB SIZE: $($exe.Length)"
          Write-Host "PARADOX HUB SHA256: $((Get-FileHash $exe.FullName -Algorithm SHA256).Hash)"

      - name: Check EXE embeds mod, installer and manifest
        shell: pwsh
        run: |
          $data=python -m PyInstaller.utils.cliutils.archive_viewer "dist/PARADOX-Hub-v0.7.0-dev.7-x64.exe" -b 2>&1 | Out-String
          foreach ($required in @('Paradox.dll', 'Install-Paradox.ps1', 'Uninstall-Paradox.ps1', 'compatibility.json')) {
            if (-not $data.Contains($required)) { throw "Missing EXE resource: $required" }
          }
          Write-Host 'PASS: Hub has the mod and transactional installation backend'

      - name: Upload PARADOX Hub EXE
        uses: actions/upload-artifact@v4
        with:
          name: PARADOX-HUB-STEAM-COMPANION-DEV7
          path: dist/PARADOX-Hub-v0.7.0-dev.7-x64.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish unofficial Steam companion beta as direct EXE
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag='v0.7.0-dev.7-hub-beta'
          $file='dist/PARADOX-Hub-v0.7.0-dev.7-x64.exe'
          $notes = @'
          PARADOX HUB (BETA) by DonMillson — unofficial companion to Among Us.
          Free Windows x64 EXE. Add it via Steam > Games > Add a Non-Steam Game.
          It discovers an installed Among Us (AppID 945360), launches through
          Steam, manages PARADOX + official dependencies, shows health and logs.
          This is NOT a Steam Store publication and does NOT include Among Us.
          It is not affiliated with, endorsed or sponsored by Innersloth LLC.
          Gameplay v19 and large 50-player matches remain runtime-unverified.
          '@
          if (gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null) {
            gh release upload $tag $file --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag $file --target $env:GITHUB_SHA --title 'PARADOX Hub dev.7 Beta (Steam companion)' --notes $notes --prerelease --repo $env:GITHUB_REPOSITORY
          }
          if ($LASTEXITCODE -ne 0) { throw 'Publishing PARADOX Hub beta failed' }
